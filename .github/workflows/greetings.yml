name: Greetings

on:
  pull_request_target:
    types: [ opened ]
  issues:
    types: [ opened ]

permissions: { }

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Greet first-time contributors
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo-token: ${{ github.token }}
          issue-message: "Thanks for opening your first issue with EmguExtensions! Please check that the issue template is complete and that a similar issue is not already open. Reproduction steps and debugging details help us investigate."
          pr-message: "Thanks for opening your first pull request with EmguExtensions! Please check that the PR template is complete and describe how you validated the changes."
